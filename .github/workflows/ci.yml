name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Target namespace'
        required: true
        default: 'iotag-sbx'
        type: choice
        options:
          - iotag-dev
          - iotag-sbx

jobs:
  set-env:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    outputs:
      values_file: ${{ steps.vars.outputs.values_file }}
      namespace: ${{ steps.vars.outputs.namespace }}
    steps:
      - name: Set environment variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "values_file=Helm/values-sbx.yaml" >> $GITHUB_OUTPUT
            echo "namespace=iotag-sbx" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ns="${{ github.event.inputs.namespace }}"
            env_suffix="${ns#iotag-}"
            echo "values_file=Helm/values-${env_suffix}.yaml" >> $GITHUB_OUTPUT
            echo "namespace=${ns}" >> $GITHUB_OUTPUT
          else
            echo "values_file=Helm/values-dev.yaml" >> $GITHUB_OUTPUT
            echo "namespace=iotag-dev" >> $GITHUB_OUTPUT
          fi

  pipeline:
    needs: set-env
    uses: AGH-iot-agent/common-pipeline/.github/workflows/common-pipeline.yml@main
    secrets: inherit
    with:
      service_name: iot-agent-authentication
      project_type: maven
      java_version: "21"
      values_file: ${{ needs.set-env.outputs.values_file }}
      namespace: ${{ needs.set-env.outputs.namespace }}
      chart_type: deployment